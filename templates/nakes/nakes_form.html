{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title }} - VIRA NAKES{% endblock %}

{% block content %}
<div class="page-header-box domain-main mb-3">
    <div>
        <h1 class="page-title-text">{{ title }}</h1>
        <p class="page-subtitle-text">Tambah atau perbarui data anggota Komite KTKL</p>
    </div>
</div>

<div class="card" style="max-width:720px;">
    <div class="card-header">
        <i class="bi bi-person-vcard me-1"></i> {{ title }}
    </div>
    <div class="card-body p-3 p-md-4">
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1 flex-md-grow-0" style="min-width:140px;">
                    <i class="bi bi-check-lg me-1"></i>Simpan
                </button>
                <a href="{% url 'nakes:list' %}" class="btn btn-outline-secondary flex-grow-1 flex-md-grow-0">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
