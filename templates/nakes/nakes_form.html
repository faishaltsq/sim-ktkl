{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} - SIM KTKL{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_title_mobile %}{{ title }}{% endblock %}

{% block content %}
<div class="card" style="max-width:720px;">
    <div class="card-header">{{ title }}</div>
    <div class="card-body p-3 p-md-4">
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1 flex-md-grow-0" style="min-width:120px;">Simpan</button>
                <a href="{% url 'nakes:list' %}" class="btn btn-outline-secondary flex-grow-1 flex-md-grow-0">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
