<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="VIRA NAKES">
  <defs>
    <!-- Teks melengkung atas -->
    <path id="arcTop" d="M 22,100 A 78,78 0 0,1 178,100" />
    <!-- Clip lingkaran agar rapi -->
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>

  <!-- Background lingkaran hijau tua -->
  <circle cx="100" cy="100" r="96" fill="#1A5E38"/>

  <!-- Ring border luar: 2 ring bertumpuk untuk kesan premium -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.35"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.18"/>

  <!-- Bulan sabit (crescent) Islam — simbol khas RS PKU Muhammadiyah: putih -->
  <!-- Dibuat dari dua lingkaran yang saling potong -->
  <path d="M 100,38 A 34,34 0 1,1 99.99,38 Z" fill="none"/>
  <!-- Simbol bulan sabit: circle besar dikurangi circle kecil offset -->
  <circle cx="100" cy="52" r="26" fill="#FFFFFF" opacity="0.0"/>

  <!-- PALANG MEDIS PUTIH (+) - tebal, proporsi besar, center di y=108 -->
  <rect x="85" y="72" width="30" height="82" rx="5" fill="#FFFFFF"/>
  <rect x="59" y="98" width="82" height="30" rx="5" fill="#FFFFFF"/>

  <!-- Bintang / ornamen kecil di atas palang sebagai aksen -->
  <!-- Diganti: figur manusia / nakes stilisasi -->
  <!-- Kepala (lingkaran kecil putih di atas palang) -->
  <circle cx="100" cy="62" r="12" fill="#1A5E38"/>
  <circle cx="100" cy="62" r="10" fill="#FFFFFF"/>

  <!-- TEKS "VIRA NAKES" melengkung mengikuti busur atas -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">VIRA NAKES</textPath>
  </text>

  <!-- Garis dekoratif bawah (pemisah tipis) -->
  <path d="M 48,162 Q 100,170 152,162" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
