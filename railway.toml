[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --no-input"

[deploy]
preDeployCommand = "python manage.py migrate && python manage.py seed_data && python manage.py seed_kredensial_master && python manage.py seed_kredensial_accounts && python manage.py sync_nakes_kredensial"
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
